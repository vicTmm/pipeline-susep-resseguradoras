name: Monitoramento SUSEP

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: monitoramento-susep
  cancel-in-progress: false

jobs:
  monitoramento:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Executar monitoramento
        run: python -m src.main

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitoramento-susep
          retention-days: 30
          path: |
            data/
            outputs/

      - name: Versionar histórico e relatórios
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history outputs/reports
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de histórico ou relatório para versionar."
          else
            git commit -m "Atualiza monitoramento SUSEP"
            git push
          fi
